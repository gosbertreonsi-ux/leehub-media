<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlayHub Admin</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<div class="topnav">
  <div class="brand"><div class="mark"></div><span>PlayHub</span> <span class="admin-tag">Admin</span></div>
  <div class="nav-icons">
    <a class="icon-btn back-link" href="index.html" title="Back to site">←</a>
  </div>
</div>

<div class="admin-wrap">

  <div class="admin-col">
    <h1>Upload a video</h1>
    <p class="admin-sub">This gets added to the home feed. Only people who've completed the payment gate can see it.</p>

    <form id="uploadForm" class="upload-card">
      <div class="field">
        <label for="vTitle">Title</label>
        <input id="vTitle" type="text" placeholder="e.g. Behind the scenes: season finale" required>
      </div>

      <div class="row2">
        <div class="field">
          <label for="vChannel">Channel name</label>
          <input id="vChannel" type="text" placeholder="e.g. Northline Studio" required>
        </div>
        <div class="field">
          <label for="vLength">Length</label>
          <input id="vLength" type="text" placeholder="e.g. 4:12" pattern="^\d{1,2}:\d{2}$" required>
        </div>
        <!-- DYNAMIC PAY-PER-VIEW PRICE SELECTOR -->
        <div class="field">
          <label for="vPrice">PPV Price (TSh)</label>
          <input id="vPrice" type="number" placeholder="e.g. 2000" min="0" value="0" required>
        </div>
      </div>


      <div class="field">
        <label for="vDesc">Description (optional)</label>
        <textarea id="vDesc" rows="3" placeholder="What's this video about?"></textarea>
      </div>

      <!-- NEW FIELD UPDATE: Secure Video Media Asset Selector -->
      <div class="field">
        <label>Video File (.mp4, .mov)</label>
        <div class="thumb-drop" id="videoDrop" style="margin-bottom: 12px;">
          <input id="vSourceFile" type="file" accept="video/mp4,video/quicktime" hidden required>
          <div class="thumb-preview" id="videoPreview">
            <span id="videoStatusText">🎬 Click to choose a video file</span>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Thumbnail Image</label>
        <div class="thumb-drop" id="thumbDrop">
          <input id="vThumb" type="file" accept="image/*" hidden required>
          <div class="thumb-preview" id="thumbPreview">
            <span>📷 Click to choose an image</span>
          </div>
        </div>
      </div>

      <p class="err" id="uploadErr"></p>
      <button type="submit" class="pay-btn">Publish to feed</button>
    </form>
  </div>

  <div class="admin-col">
    <h1>Uploaded videos <span class="count" id="count">(0)</span></h1>
    <p class="admin-sub">Visible to viewers only after they pass the payment gate.</p>
    <div class="admin-list" id="adminList"></div>
  </div>

</div>

<script src="admin.js"></script>
</body>
</html>
